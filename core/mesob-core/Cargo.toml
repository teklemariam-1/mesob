[package]
name = "mesob-core"
description = "Mesob shared security core: title format, signatures, license sealing, decryption, codes and sales logs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
aes = "0.8"
ctr = "0.9"
aes-gcm = "0.10"
thiserror = "1"
zeroize = "1"

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
