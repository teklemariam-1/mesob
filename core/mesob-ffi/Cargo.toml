[package]
name = "mesob-ffi"
description = "C ABI (Windows, P/Invoke) and JNI (Android) bridge to mesob-core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mesob"
crate-type = ["cdylib", "rlib"]

[features]
# Development builds: accept the vendor key at runtime. Never ship a lab core.
lab = []

[dependencies]
mesob-core = { path = "../mesob-core" }
serde_json = "1"
base64 = "0.22"
hex = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
